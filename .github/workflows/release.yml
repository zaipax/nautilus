name: Publish Windows release

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths: ['release.json', '.github/workflows/release.yml']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify archive and standalone Windows CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RELEASE_TAG = (Get-Content release.json -Raw | ConvertFrom-Json).tag
          "RELEASE_TAG=$env:RELEASE_TAG" | Add-Content $env:GITHUB_ENV
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag' }
          $version = $env:RELEASE_TAG.Substring(1)
          $folder = "releases/$env:RELEASE_TAG"
          $asset = "nautilus-$version-windows-x64.zip"
          $expected = ((Get-Content "$folder/SHA256SUMS.txt" -Raw).Trim() -split '\s+')
          if ($expected.Count -ne 2 -or $expected[1] -ne $asset) { throw 'Invalid checksum manifest' }
          $actual = (Get-FileHash "$folder/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected[0]) { throw 'ZIP SHA256 mismatch' }
          Expand-Archive "$folder/$asset" -DestinationPath "$env:RUNNER_TEMP/nautilus-validation"
          $runtime = "$env:RUNNER_TEMP/nautilus-validation/nautilus-$version-windows-x64"
          foreach ($line in Get-Content "$runtime/FILES-SHA256.txt") {
            $hash, $name = $line -split '  ', 2
            if ($name -match '(^/|\.\.|:)') { throw 'Invalid runtime path' }
            if ((Get-FileHash "$runtime/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
              throw "Runtime checksum mismatch: $name"
            }
          }
          $versionOutput = (& "$runtime/nautilus.exe" --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $versionOutput -ne "Nautilus $version") { throw 'Version smoke test failed' }
          & "$runtime/nautilus.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Help smoke test failed' }
          $report = @(
            "Release: $env:RELEASE_TAG"
            "ZIP SHA256: $actual"
            "Windows runner: $env:ImageOS / $env:ImageVersion"
            'Archive and all runtime file checksums: passed'
            "Standalone version/help: passed ($versionOutput)"
            'GPU/pool validation: performed separately on RTX 5060 Ti; see release notes'
            'Authenticode: unsigned'
          )
          $defender = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($defender -and $defender.AntivirusEnabled -and $defender.AntivirusSignatureVersion) {
            $scanner = Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $scanner) { throw 'Defender enabled but scanner unavailable' }
            $report += "Defender signatures: $($defender.AntivirusSignatureVersion)"
            & $scanner.FullName -Scan -ScanType 3 -File $runtime -DisableRemediation 2>&1 |
              Tee-Object -Variable scanOutput | Write-Host
            $scanExit = $LASTEXITCODE
            $report += "Defender custom scan exit: $scanExit"
            $report += ($scanOutput | Out-String)
            if ($scanExit -ne 0) { throw "Defender reported a detection or scan error (exit $scanExit); publication stopped" }
            $report += 'Defender scan: completed with no detection reported by this scan'
          } else {
            $report += 'Defender scan: unavailable on this runner; no clean-scan claim is made'
          }
          $report += 'This check does not guarantee future antivirus or SmartScreen classifications.'
          $report | Set-Content "$folder/WINDOWS-VALIDATION.txt" -Encoding utf8
          Get-Content "$folder/WINDOWS-VALIDATION.txt"
      - name: Upload verified release assets and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = "releases/$env:RELEASE_TAG"
          $version = $env:RELEASE_TAG.Substring(1)
          $existing = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Release already published; refusing to overwrite' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "Nautilus $version - Windows x64" --notes-file "$folder/RELEASE-NOTES.md"
            if ($LASTEXITCODE) { throw 'Release creation failed' }
          }
          gh release upload $env:RELEASE_TAG "$folder/nautilus-$version-windows-x64.zip" "$folder/SHA256SUMS.txt" "$folder/WINDOWS-VALIDATION.txt" --clobber
          if ($LASTEXITCODE) { throw 'Asset upload failed' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE) { throw 'Publication failed' }
